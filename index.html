<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Cheers</title>
  <meta name="description" content="Rate, map and remember every espresso martini.">
  <meta name="theme-color" content="#1c120d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Cheers">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/venues" class="brand" aria-label="The Cheers home">
      <svg viewBox="0 0 512 512" width="28" height="28" aria-hidden="true"><path d="M116 150h280l-118 150v96h62a14 14 0 0 1 0 28H172a14 14 0 0 1 0-28h62v-96z" fill="#e9d7b5" stroke="#e9d7b5" stroke-width="10" stroke-linejoin="round"/><g fill="#1c120d"><ellipse cx="228" cy="183" rx="14" ry="9"/><ellipse cx="258" cy="178" rx="14" ry="9"/><ellipse cx="287" cy="186" rx="14" ry="9"/></g></svg>
      <span>The Cheers</span>
    </a>
    <h1 id="page-title" class="page-title">Venues</h1>
    <a href="#/settings" class="icon-btn" aria-label="Settings">⚙︎</a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Primary">
    <a href="#/venues" data-tab="venues"><span class="tab-ico">★</span>Venues</a>
    <a href="#/map" data-tab="map"><span class="tab-ico">◎</span>Map</a>
    <a href="#/rate" data-tab="rate" class="tab-primary"><span class="tab-ico">+</span>Rate</a>
    <a href="#/history" data-tab="history"><span class="tab-ico">≡</span>History</a>
    <a href="#/stats" data-tab="stats"><span class="tab-ico">▤</span>Stats</a>
  </nav>

  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
